# Configuración mínima para la CLI de Supabase (la usa el despliegue automático).
project_id = "galeria-eventos"

# El control automático de la plataforma solo entiende las claves anteriores.
# Cada función valida la sesión por su cuenta (auth.getUser), incluidas las de invitados anónimos.

[functions.sign-upload]
verify_jwt = false

[functions.borrar]
verify_jwt = false

[functions.crear-pago]
verify_jwt = false

# Mercado Pago llama sin sesión: la función verifica la firma y consulta el pago a Mercado Pago.
[functions.mp-webhook]
verify_jwt = false
