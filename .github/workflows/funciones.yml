name: Funciones

# Verifica los tipos de las funciones de Supabase (Deno) en cada cambio.

on:
  push:
    paths: ['supabase/functions/**', '.github/workflows/funciones.yml']
  pull_request:
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar tipos
        run: deno check supabase/functions/sign-upload/index.ts
