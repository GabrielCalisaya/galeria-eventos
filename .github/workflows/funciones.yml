name: Funciones

# Verifica los tipos de las funciones de Supabase (Deno) en cada cambio.

on:
  push:
    paths: ['supabase/functions/**', '.github/workflows/funciones.yml']
  pull_request:
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar tipos
        run: |
          set +e
          cd supabase/functions/sign-upload
          deno check index.ts > resultado.txt 2>&1
          estado=$?
          cat resultado.txt
          if [ $estado -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' resultado.txt | grep -vE '^\s*$' | head -30 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $estado
