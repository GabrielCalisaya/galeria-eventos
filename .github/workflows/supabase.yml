name: Supabase

# Aplica la base de datos y despliega la función de subida en Supabase.
# Corre al cambiar algo dentro de supabase/ en main, o a mano desde la pestaña Actions.
# Si los secretos de Supabase no están cargados, no hace nada.

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Revisar secretos
        id: chequeo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Faltan secretos de Supabase; se omite el despliegue."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.chequeo.outputs.listo == 'si'

      - uses: supabase/setup-cli@v1
        if: steps.chequeo.outputs.listo == 'si'
        with:
          version: latest

      - name: Vincular proyecto
        if: steps.chequeo.outputs.listo == 'si'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar base de datos
        if: steps.chequeo.outputs.listo == 'si'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Cargar claves de R2 en la función
        if: steps.chequeo.outputs.listo == 'si'
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}" \
            R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
            R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            R2_BUCKET="${{ secrets.R2_BUCKET }}" \
            ALLOWED_ORIGIN="${{ secrets.ALLOWED_ORIGIN }}"

      - name: Cargar claves de Mercado Pago (si están)
        if: steps.chequeo.outputs.listo == 'si'
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        run: |
          args=()
          [ -n "$MP_ACCESS_TOKEN" ] && args+=("MP_ACCESS_TOKEN=$MP_ACCESS_TOKEN")
          [ -n "$MP_WEBHOOK_SECRET" ] && args+=("MP_WEBHOOK_SECRET=$MP_WEBHOOK_SECRET")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"
          else
            echo "Sin claves de Mercado Pago todavía."
          fi

      - name: Desplegar funciones
        if: steps.chequeo.outputs.listo == 'si'
        run: |
          for dir in supabase/functions/*/; do
            nombre=$(basename "$dir")
            [ "$nombre" = "_shared" ] && continue
            echo "== $nombre"
            supabase functions deploy "$nombre" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          done
